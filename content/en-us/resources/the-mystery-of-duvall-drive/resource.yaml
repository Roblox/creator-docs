    - type: toc
      id: contents
      title: A house is never just a house.
      text: |-
        The driveway disappears into the trees. Somewhere above the roof, the sky
        is coming apart.

        In *The Mystery of Duvall Drive*, an abandoned family home becomes a study in
        how to build belief. Its rooms invite exploration, its objects hold clues, and
        its familiar spaces can turn into something impossible.

        Behind that illusion is a series of practical choices: a floor plan tested
        before it was beautiful, materials designed to be reused, sound that guides
        attention, and systems that keep a shared mystery moving. This is the story of
        how those choices came together.

        [Begin with the first sketch ↗](#construct-the-house)
      include:
        - concept
        - task
  chapters:
    - id: construct-the-house
      order: 1
      sections:
        - type: concept
          id: construct-the-house
          navLabel: Construct the house
          hero:
            title: A house with something to hide.
            description:
              Before the storm, before the secrets, there was a floor plan. The
              first challenge was making a house worth getting lost in.
            image: assets/resources/mystery-of-duvall-drive/constructing-the-house/overview.png
            alt:
              A dimly lit library with a fireplace, wooden furniture, and a classical
              bust.
            caption:
              The finished interior. Its atmosphere rests on decisions made while the
              house was still a collection of simple shapes.
          blocks:
            - type: markdown
              markdown: >-
                The road bends before the house comes into view. Trees interrupt
                the sightline. The driveway rises, and the building begins to
                loom. Long before a player touches a puzzle, the architecture is
                already telling them how to feel.


                That approach was designed on paper first. The team mapped the
                story beats they wanted players to encounter, then arranged the
                road, hills, lake, and house around them. A glimpse mattered
                more than a complete reveal. The storm could wait until the
                player had a reason to come closer.


                ## Draw the experience, not just the rooms


                Inside, every room needed a purpose. It could hold a surprise, a
                clue, a puzzle, or an opportunity to learn something about the
                family. The floor plan became a way of pacing those discoveries
                without assuming everyone would explore in the same order.


                Harder puzzles moved farther from the front door. An attic and a
                basement made room for both gameplay and atmosphere. The house
                had to feel plausible enough to explore, but strange enough to
                keep curiosity alive.
            - type: figure
              image: assets/resources/mystery-of-duvall-drive/constructing-the-house/blueprint-whole-house.png
              alt:
                An early floor plan of the house, annotated with ideas for rooms and
                encounters.
              caption:
                'The first blueprint was also a story map: a place to work out what
                might happen, and where.'
            - type: markdown
              markdown: >-
                ## Get it playable before it gets precious


                Simple parts and temporary Creator Store assets let the team
                start playtesting within the first few days. In those early
                versions, visual polish was beside the point. Could players find
                the house? Did the approach take too long? Was a room inviting,
                confusing, or simply too large?


                They built with an avatar beside the geometry, checking
                doorways, stairs, and furniture against a body rather than a
                number. Both blocky and more realistic characters needed to
                belong in the same space. Small, inexpensive changes at this
                stage protected the layout from much more expensive corrections
                later.
            - type: quote
              attribution: From the original development notes
              markdown: No amount of experience guarantees your first ideas are the best ones.
