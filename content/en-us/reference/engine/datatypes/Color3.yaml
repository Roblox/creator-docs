    summary: |
      Returns the relative luminance of a `Datatype.Color3`.
    description: |
      Returns the
      [relative luminance](https://www.w3.org/TR/WCAG21/#dfn-relative-luminance)
      of the color, following the WCAG 2.1 definition. The color's components
      are treated as gamma-encoded sRGB and are clamped to the range of 0 to 1
      before the calculation, so out-of-range (HDR) values behave like their
      clamped equivalents.

      ```lua
      local red = Color3.fromRGB(255, 0, 0)
      print(red:GetLuminance())  --> 0.2126

      local white = Color3.new(1, 1, 1)
      print(white:GetLuminance())  --> 1

      local black = Color3.new(0, 0, 0)
      print(black:GetLuminance())  --> 0
      ```
    parameters: []
    returns:
