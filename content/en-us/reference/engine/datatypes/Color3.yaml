  - name: Color3:GetContrastingColor
    summary: |
      Returns whichever candidate color has the highest contrast against a
      `Datatype.Color3`.
    description: |
      Compares this color against each of the given candidate colors using
      `Datatype.Color3:GetContrastRatio()` and returns whichever candidate has
      the highest contrast. If two or more candidates tie, the earliest one is
      returned.

      Called with no arguments, this is equivalent to calling it with pure black
      (`Color3.new(0, 0, 0)`) followed by pure white (`Color3.new(1, 1, 1)`), so
      a tie between them resolves to black.

      ```lua
      local orange = Color3.fromRGB(255, 165, 0)
      print(orange:GetContrastingColor())  --> 0, 0, 0

      local darkBlue = Color3.fromRGB(0, 0, 139)
      print(darkBlue:GetContrastingColor())  --> 1, 1, 1

      -- Custom candidates can be supplied instead of the black/white default.
      local offBlack = Color3.fromRGB(20, 20, 20)
      local offWhite = Color3.fromRGB(240, 240, 240)
      print(orange:GetContrastingColor(offBlack, offWhite))  --> 0.0784314, 0.0784314, 0.0784314
      ```
    parameters:
      - name: ...
        type: Color3
        default:
        summary: |
          The candidate colors to compare against this color. Defaults to pure
          black and pure white when no candidates are given.
    returns:
      - type: Color3
        summary: |
          The candidate with the highest `Datatype.Color3:GetContrastRatio()`
          against this color.
