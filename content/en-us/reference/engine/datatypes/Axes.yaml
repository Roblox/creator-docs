name: Axes
type: datatype
summary: |
  The `Axes` data type is for the `Class.ArcHandles` class to control which
  rotation axes are currently enabled.
description: |
  The `Datatype.Axes` data type contains a set of enabled 3D axes, represented
  as a bitmask. It is used by the `Class.ArcHandles` class through its
  `Class.ArcHandles.Axes|Axes` property to control which rotation arc handles
  are visible.

  `Datatype.Axes` exposes three axis properties (`X`, `Y`, `Z`) and six face
  properties (`Top`, `Bottom`, `Left`, `Right`, `Front`, `Back`). Because faces
  map to their corresponding axis, face pairs always share the same value: `Top`
  and `Bottom` both reflect the Y axis, `Left` and `Right` both reflect the X
  axis, and `Front` and `Back` both reflect the Z axis.

  ```lua
  -- Enable arc handles for the X and Y axes only
  local arcHandles = Instance.new("ArcHandles")
  arcHandles.Axes = Axes.new(Enum.Axis.X, Enum.Axis.Y)
  ```

  Like most data types on Roblox, the `Datatype.Axes` data type is immutable:
  you cannot assign to its properties once created.
