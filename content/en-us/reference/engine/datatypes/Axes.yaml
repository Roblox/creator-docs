constructors:
  - name: Axes.new
    summary: |
      Creates a new Axes using list of axes and/or faces. NormalIds (faces) are
      converted to the corresponding axes.
    description: |
      Creates a new `Datatype.Axes` from up to 6 `Enum.Axis` or `Enum.NormalId`
      values. Each `Enum.NormalId` is converted to its corresponding axis (for
      example, `Enum.NormalId.Top` and `Enum.NormalId.Bottom` both enable the Y
      axis). Calling `Axes.new()` with no arguments returns an Axes with all
      properties set to `false`.

      ```lua
      -- Using Enum.Axis values
      local axes = Axes.new(Enum.Axis.X, Enum.Axis.Z)
      print(axes.X) -- true
      print(axes.Y) -- false

      -- Using Enum.NormalId values (converted to axes)
      local axes2 = Axes.new(Enum.NormalId.Top, Enum.NormalId.Right)
      print(axes2.Y) -- true (Top -> Y axis)
      print(axes2.X) -- true (Right -> X axis)
      ```
    parameters:
      - name: axes
        type: Tuple
        default:
        summary: |
          Any combination of `Enum.Axis` and/or `Enum.NormalId` values (up to 6)
          specifying which axes to enable.
