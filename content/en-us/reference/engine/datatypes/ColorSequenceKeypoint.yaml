name: ColorSequenceKeypoint
type: datatype
summary: |
  A color and time value that represents a keypoint in a
  `Datatype.ColorSequence`.
description: |
  The `Datatype.ColorSequenceKeypoint` data type represents a single keypoint in
  a `Datatype.ColorSequence`. Each keypoint has a time position between `0` and
  `1` and a `Datatype.Color3` value that defines the color at that point in the
  sequence. Properties that use a `Datatype.ColorSequence`, such as
  `Class.ParticleEmitter.Color`, `Class.Beam.Color`, and `Class.Trail.Color`,
  interpolate linearly between consecutive keypoints in RGB color space.

  ```lua
  local keypoints = {
      ColorSequenceKeypoint.new(0, Color3.fromRGB(255, 0, 0)),
      ColorSequenceKeypoint.new(0.5, Color3.fromRGB(0, 255, 0)),
      ColorSequenceKeypoint.new(1, Color3.fromRGB(0, 0, 255)),
  }
  local colorSequence = ColorSequence.new(keypoints)
  ```
