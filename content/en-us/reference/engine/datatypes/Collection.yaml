name: Collection
type: datatype
summary: |
  A live, query-based group of instances returned by
  `Class.CollectionService:CreateCollection()`.
description: |
  A `Collection` is a group of instances you can attach code to, created with
  `Class.CollectionService:CreateCollection()|CreateCollection(query, root)`.
  The collection tracks every descendant of `root` (default `Class.Workspace`)
  that matches `query`, adding instances as they start matching and removing
  them when they stop.

  You attach code by assigning functions as named callbacks. Callbacks exist for
  instance events, property and attribute changes, several `Class.RunService`
  events, and two collection-specific callbacks: `OnAdded` and `OnRemoved`. When
  an instance joins, each callback is connected to that instance. When it
  leaves, those connections are removed. You write the code once, and the
  collection handles per-instance setup and teardown. A collection keeps running
  after its variable goes out of scope.

  ```lua
  local CollectionService = game:GetService("CollectionService")

  -- Matches every Part under Workspace
  local collection = CollectionService:CreateCollection("Part")

  -- Fires when a part joins the collection
  function collection.OnAdded(part)
  	print("Part added to the collection", part)
  end

  -- Fires when a part in the collection is touched
  function collection.OnTouched(part, otherPart)
  	print(part, "was touched by", otherPart)
  end
  ```

  #### Query Syntax

  The query is a CSS-like selector, the same syntax used by
  `Class.Instance:QueryDescendants()|QueryDescendants()` and `Class.StyleRule`.
  See `Class.Instance:QueryDescendants()|QueryDescendants()` for the full
  grammar. Comma-separated selectors form a union. The rightmost selector in a
  chain is the matched instance, so `Folder > Part` matches the parts, not the
  folders.

  ##### Filters

  Multiple filters on one selector must all match.

  - `ClassName` — Instances of that class, using `Class.Object:IsA()|IsA()`.
  - `#Name` — Instances with that `Class.Instance.Name|Name`.
  - `.Tag` — Instances with that `Class.CollectionService` tag.
  - `[Property = value]` — Instances whose property equals the value.
  - `[$Attribute]` or `[$Attribute = value]` — Instances that have the
    attribute, optionally with that value.

  Numeric properties and attributes also support `>`, `<`, `>=`, and `<=`.

  ```lua
  -- All Parts
  local parts = "Part"
  -- Instances named Dog with the tag Scruffy
  local mutts = "#Dog.Scruffy"
  -- BaseParts named DodgeBall with CanCollide true and attribute Thrown true
  local dodgeballs = "BasePart#DodgeBall[CanCollide = true][$Thrown = true]"
  ```

  ##### Combinators

  - `A > B` — `B` is a child of `A`.
  - `A >> B` — `B` is a descendant of `A`.

  ```lua
  -- Parts named Brick whose parent is a Model named Wall
  local wallBricks = "Model#Wall > Part#Brick"
  -- Parts tagged Leaf anywhere inside a Model named Tree
  local leaves = "Model#Tree >> Part.Leaf"
  ```

  ##### Pseudo-classes

  - `:has(selector)` — Instances with a child or descendant matching `selector`.
  - `:not(selector)` — Instances that do not match `selector`.
  - `:in-radius(studs, selector)` — `Class.BasePart|BaseParts` within `studs` of
    an instance matching `selector`.

  ```lua
  -- Instances without an OnFire attribute
  local notBurning = ":not([$OnFire])"
  -- MeshParts with a child tagged SwordPart
  local sheaths = "MeshPart:has(> .SwordPart)"
  -- Parts tagged FireBall within 10 studs of a character
  local nearbyFireballs = "BasePart.FireBall:in-radius(10, Model:has(> Part#HumanoidRootPart))"
  ```

  #### Callbacks

  Assign a callback with function-statement syntax:

  ```lua
  local CollectionService = game:GetService("CollectionService")
  local collection = CollectionService:CreateCollection("Part")

  function collection.OnAdded(part)
  	-- Fires when a part joins the collection
  end
  ```

  Each callback can be assigned **only once**. Reassigning it raises an error,
  so a collection's behavior can't be silently replaced elsewhere.

  ##### OnAdded and OnRemoved

  - `OnAdded(instance)` — Fires when an instance starts matching the query. When
    you first assign `OnAdded`, it also fires once for every instance already in
    the collection.
  - `OnRemoved(instance)` — Fires when an instance stops matching. For example,
    its tag is removed, it leaves the root, it is destroyed, the collection is
    destroyed, or `Datatype.Collection.Enabled|Enabled` is set to `false`.

  ##### Membership Guarantees

  Collections guarantee that:

  1. An instance is visible as a member only after its `OnAdded` has run.
  2. Callbacks fire only on instances that currently match the query.
  3. `OnRemoved` always fires when an instance stops matching.

  Together, these let `OnAdded` and `OnRemoved` act as a constructor and
  destructor. Per-instance data created in `OnAdded` exists for every other
  callback, and can always be cleaned up in `OnRemoved`.

  Because of guarantee #2, a callback can rely on the query. For example, with
  `Part:has(> Part#Handle)`, `instance.Handle` always exists inside a callback.
  This also means a pending callback is skipped if its instance stops matching
  first. For example, if a property changes and the instance stops matching
  before the `OnPropertyChanged` callback runs, that callback is skipped.

  Guarantee #3 can be broken only by a crash or abrupt shutdown before
  `OnRemoved` runs.

  ##### RunService Callbacks

  These callbacks fire once per step **for each member**. Each receives the
  instance and the step's `deltaTime`.

  <table>
  <thead>
    <tr>
      <th>Collection Callback</th>
      <th>Equivalent</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><code>OnHeartbeat</code></td>
      <td><code>Class.RunService.Heartbeat</code></td>
    </tr>
    <tr>
      <td><code>OnPreRender</code></td>
      <td><code>Class.RunService.PreRender</code></td>
    </tr>
    <tr>
      <td><code>OnPreAnimation</code></td>
      <td><code>Class.RunService.PreAnimation</code></td>
    </tr>
    <tr>
      <td><code>OnPreSimulation</code></td>
      <td><code>Class.RunService.PreSimulation</code></td>
    </tr>
    <tr>
      <td><code>OnPostSimulation</code></td>
      <td><code>Class.RunService.PostSimulation</code></td>
    </tr>
  </tbody>
  </table>

  The collection connects to each `Class.RunService` event once and calls the
  callback for every member, instead of holding one connection per instance.
  This runs at about the speed of a loop over a Luau table.

  `Class.RunService` callbacks and `Datatype.Collection:ForEach()|ForEach()`
  **cannot yield**. Unlike most non-yielding APIs, they still support debugger
  breakpoints.

  There are no callbacks for
  `Class.RunService:BindToSimulation()|BindToSimulation()` or
  `Class.RunService:BindToAnimation()|BindToAnimation()`. Instead, call
  `Datatype.Collection:ForEach()|ForEach()` inside the binding. This also lets
  you set the binding's frequency and priority:

  ```lua
  local CollectionService = game:GetService("CollectionService")
  local RunService = game:GetService("RunService")

  local collection = CollectionService:CreateCollection("Part")

  RunService:BindToSimulation(function(deltaTime)
  	collection:ForEach(function(part)
  		-- Simulation code
  	end)
  end, Enum.StepFrequency.Hz60)
  ```

  ##### Event, Property, and Attribute Callbacks

  A collection can connect a callback to any event, property change, or
  attribute change on its members. Here, `X` is the name of the event, property,
  or attribute.

  - `OnX(instance, ...)` — Connects to event `X` on each member. The callback
    receives the instance, then the event's arguments. For example, `OnTouched`
    connects to `Class.BasePart.Touched`.
  - `OnPropertyChanged.X(instance)` — Fires when property `X` changes, like
    `Class.Object:GetPropertyChangedSignal()|GetPropertyChangedSignal()`.
  - `OnAttributeChanged.X(instance)` — Fires when attribute `X` changes, like
    `Class.Instance:GetAttributeChangedSignal()|GetAttributeChangedSignal()`.

  ```lua
  local CollectionService = game:GetService("CollectionService")
  local collection = CollectionService:CreateCollection("Part.MyTag")

  function collection.OnTouched(part, otherPart)
  	-- otherPart is the argument from BasePart.Touched
  end

  function collection.OnPropertyChanged.Color(part)
  	-- Fires when the part's Color changes
  end

  function collection.OnAttributeChanged.MyAttribute(part)
  	-- Fires when the part's MyAttribute attribute changes
  end
  ```

  A collection can match instances of different classes, so a callback may not
  apply to every member:

  - Members without the named event or property are skipped. For example, a
    collection of `Class.Part|Parts` and `Class.Folder|Folders` can define
    `OnTouched`, but only the parts respond.
  - An event or property name that doesn't exist on any class, such as a
    misspelled `OnTuched`, raises an error when assigned.

  #### Lifetime

  A collection is not destroyed when its variable goes out of scope. Call
  `Datatype.Collection:Destroy()|Destroy()` to stop it. If the collection's root
  is destroyed, the collection stops tracking instances and is eventually
  garbage collected.

  ```lua
  local CollectionService = game:GetService("CollectionService")
  local root = Instance.new("Folder", workspace)

  do
  	local collection = CollectionService:CreateCollection("Part.MyTag", root)
  end
  -- The variable is out of scope, but the collection is still running

  root:Destroy()
  -- The collection stops tracking instances and can be garbage collected
  ```

  #### Typing and Autocomplete

  When the query names a class, callbacks receive that type. For example,
  `CreateCollection("Part.TagName")` passes a `Class.Part` to its callbacks.

  Autocomplete only suggests callbacks that the class supports. `OnTouched` is
  suggested for `"Part.TagName"`, but not for a query that can't match a
  `Class.BasePart`. If the query names no class, the first argument is typed as
  `Class.Instance`.
