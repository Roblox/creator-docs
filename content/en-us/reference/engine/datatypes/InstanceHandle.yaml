methods:
  - name: InstanceHandle:Get
    summary: |
      Returns the referenced `Class.Instance` if it's available locally,
      otherwise `nil`.
    description: |
      This method doesn't yield.

      `Get()` returns `nil` when the handle is empty, when the target hasn't
      arrived on the client or server running the script, when the target is no
      longer available after streaming out, when the target has been garbage
      collected, and when the target isn't accessible to the calling script. Use
      `Datatype.InstanceHandle:Wait()` to yield until the target arrives instead
      of checking once.
    parameters: []
    returns:
      - type: Instance?
        summary: |
          The referenced instance, or `nil` if it isn't available locally.
    code_samples: []
