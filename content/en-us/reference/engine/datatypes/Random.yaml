  - name: Random.new
    summary: |
      Returns a new pseudorandom generator using an optional seed.
    description: |
      Returns a new `Datatype.Random` object. If you don't provide the seed
      parameter, `Datatype.Random` uses a seed from an internal entropy source.

      If you provide a seed, it should be within the range [-9007199254740991,
      9007199254740991], and `Datatype.Random` will round it down to the nearest
      integer. So seeds of 0, 0.99, and `Library.math.random()` all produce
      identical generators. If you need to generate a seed and store it for
      later retrieval, use `Library.math.random()|math.random(max)`.
    parameters:
      - name: seed
        type: number
        default:
        summary: |
          An optional number that initializes the pseudorandom number
          generator's internal state, truncated toward zero to a whole number.
          Should be within the range [-9007199254740991, 9007199254740991];
          values outside this range are clamped to 0.
