math_operations:
  - name: '*'
    operation: '*'
    summary: |
      Produces a new `Datatype.CFrame` representing the composition of the two
      `Datatype.CFrame|CFrames`.
    description: |
      Composes two `Datatype.CFrame` transformations, producing a new
      `Datatype.CFrame` that applies the right operand's transform in the left
      operand's local space. This is equivalent to
      `Datatype.CFrame:ToWorldSpace()` and is the standard way to combine
      translations and rotations.
    type_a: CFrame
    type_b: CFrame
    return_type: CFrame
    code_samples: []
    tags: []
    deprecation_message: ''
  - name: '*'
    operation: '*'
    summary: |
      Produces a `Datatype.Vector3` transformed from object to world
      coordinates.
    description: |
      Transforms a `Datatype.Vector3` from the `Datatype.CFrame` object's local
      (object) space into world space, applying both rotation and translation.
      Equivalent to `Datatype.CFrame:PointToWorldSpace()`.
    type_a: CFrame
    type_b: Vector3
    return_type: Vector3
    code_samples: []
    tags: []
    deprecation_message: ''
  - name: +
    operation: +
    summary: |
      Produces a `Datatype.CFrame` translated in world space by the
      `Datatype.Vector3`.
    description: |
      Produces a `Datatype.CFrame` with its position offset by the
      `Datatype.Vector3` in world space. The orientation remains unchanged. Only
      the translational component is affected; rotation is preserved as-is.
    type_a: CFrame
    type_b: Vector3
    return_type: CFrame
    code_samples: []
    tags: []
    deprecation_message: ''
  - name: '-'
    operation: '-'
    summary: |
      Produces a `Datatype.CFrame` translated in world space by the negative
      `Datatype.Vector3`.
    description: |
      Produces a `Datatype.CFrame` with its position offset by the negated
      `Datatype.Vector3` in world space. The orientation remains unchanged.
      Equivalent to `CFrame + (-v)`.
    type_a: CFrame
    type_b: Vector3
    return_type: CFrame
    code_samples: []
    tags: []
    deprecation_message: ''
