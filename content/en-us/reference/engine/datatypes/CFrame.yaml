methods:
  - name: CFrame:Inverse
    summary: |
      Returns the inverse of the `Datatype.CFrame`.
    description: |
      Returns the inverse of the `Datatype.CFrame`, representing the
      transformation that undoes the original. For any `Datatype.CFrame` `cf`,
      the expression `cf * cf:Inverse()` produces the identity
      `Datatype.CFrame`. The inverse reverses both the rotation (transposing the
      rotation matrix) and the translation.
    parameters: []
    returns:
      - type: CFrame
        summary: |
          The inverse CFrame that reverses this transformation.
    code_samples: []
    tags: []
    deprecation_message: ''
  - name: CFrame:Lerp
    summary: |
      Returns a `Datatype.CFrame` interpolated between itself and `goal` by the
      fraction `alpha`.
    description: |
      Returns a `Datatype.CFrame` interpolated between itself and `goal` by the
      fraction `alpha`. The positional component is interpolated linearly while
      the rotational component is interpolated using spherical linear
      interpolation (slerp), producing a constant-speed rotation along the
      shortest arc. An `alpha` of 0 returns the original `Datatype.CFrame` and
      an `alpha` of 1 returns `goal`.
    parameters:
      - name: goal
        type: CFrame
        default:
        summary: |
          The target CFrame to interpolate toward.
      - name: alpha
        type: number
        default:
        summary: |
          The interpolation fraction, where 0 is the original and 1 is `goal`.
    returns:
      - type: CFrame
        summary: |
          The interpolated CFrame between the original and `goal`.
    code_samples: []
    tags: []
    deprecation_message: ''
  - name: CFrame:Orthonormalize
    summary: |
      Returns an orthonormalized copy of the `Datatype.CFrame`.
    description: |
      Returns an orthonormalized copy of the `Datatype.CFrame`. The
      `Class.BasePart.CFrame` property automatically applies orthonormalization,
      but other APIs which take `Datatype.CFrame|CFrames` do not, so this method
      is occasionally necessary when incrementally updating a `Datatype.CFrame`
      and using it with them.
    parameters: []
    returns:
