  - name: CFrame:GetComponents
    summary: |
      Returns the values `x`, `y`, `z`, `R00`, `R01`, `R02`, `R10`, `R11`,
      `R12`, `R20`, `R21`, and `R22`, where `x` `y` `z` represent the position
      of the `Datatype.CFrame` and `R00`‑`R22` represent its 3&times;3 rotation
      matrix.
    description: |
      Returns the 12 numeric components of the `Datatype.CFrame` as a tuple:
      `x`, `y`, `z` (position), followed by `R00`, `R01`, `R02`, `R10`, `R11`,
      `R12`, `R20`, `R21`, `R22` (the 3&times;3 rotation matrix in row-major
      order). This is the reverse of the 12-argument `Datatype.CFrame.new()`
      constructor.

      ```lua
      local cf = CFrame.new(1, 2, 3) * CFrame.fromEulerAnglesXYZ(0, math.rad(90), 0)
      local x, y, z, R00, R01, R02, R10, R11, R12, R20, R21, R22 = cf:GetComponents()
      ```
    parameters: []
    returns:
      - type: Tuple
        summary: |
