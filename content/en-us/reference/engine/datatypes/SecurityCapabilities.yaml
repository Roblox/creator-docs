name: SecurityCapabilities
type: datatype
summary: |
  A set of `Enum.SecurityCapability` items. See
  [script capabilities](../../../scripting/capabilities.md).
description: |
  An immutable set of `Enum.SecurityCapability` values that controls which
  engine APIs and actions a script inside a sandboxed container can access.
  Assign a `SecurityCapabilities` value to an instance's
  `Class.Instance.Capabilities|Capabilities` property to restrict the scripts
  beneath it.

  Capability enforcement takes effect when
  `Class.Workspace.SandboxedInstanceMode` is set to
  `Enum.SandboxedInstanceMode.Experimental`.
