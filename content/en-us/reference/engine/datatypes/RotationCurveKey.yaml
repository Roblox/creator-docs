    description: |
      Defines the interpolation mode used for the curve segment that begins at
      this key and ends at the next key. Possible values are
      `Enum.KeyInterpolationMode.Constant` (holds the key's value until the next
      key), `Enum.KeyInterpolationMode.Linear` (linearly interpolates between
