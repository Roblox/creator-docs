  - name: unpack
    summary: |
      Returns all elements from the given list as a tuple.
    description: |
      Returns the elements from the given `list` as separate return values,
      equivalent to `list[i], list[i+1], ..., list[j]`. By default, `i` is `1`
      and `j` is the length of `list` (as defined by the `#` operator). If the
      range is empty (`i > j`), no values are returned. An error is raised if
      the requested range is too large to fit on the stack.

      ```lua
      local t = {10, 20, 30, 40, 50}
      print(unpack(t)) --> 10  20  30  40  50
      print(unpack(t, 2, 4)) --> 20  30  40

      -- Common pattern: forwarding a stored argument list
      local args = {1, "hello", true}
      someFunction(unpack(args))
      ```
    parameters:
      - name: list
        type: table
        default:
        summary: |
          The list of elements to be unpacked.
      - name: i
        type: int
        default: 1
        summary: |
          The index of the first element to unpack.
      - name: j
        type: int
        default: '#list'
        summary: |
          The index of the last element to unpack.
    returns:
      - type: Variant
        summary: |
          The elements `list[i]` through `list[j]` as separate return values.
    tags: []
    code_samples: []
    deprecation_message: ''
  - name: xpcall
    summary: |
      Similar to `Global.LuaGlobals.pcall()` except it uses a custom error
      handler.
    description: |
      This function is similar to `Global.LuaGlobals.pcall()`, except that you
      can set a new error handler.

      `xpcall()` calls function `f` in protected mode, using `err` as the error
      handler, and passes a list of arguments. Any error inside `f` is not
      propagated; instead, `xpcall()` catches the error, calls the `err`
      function with the original error object, and returns a status code. Its
      first result is the status code (a boolean), which is true if the call
      succeeds without errors. In this case, `xpcall()` also returns all results
      from the call, after this first result. In case of any error, `xpcall()`
      returns false plus the result from `err`.

      Unlike `Global.LuaGlobals.pcall()`, the `err` function preserves the stack
      trace of function `f`, which can be inspected using `Library.debug.info()`
      or `Library.debug.traceback()`.
    parameters:
      - name: f
        type: function
        default:
        summary: |
          The function to be called in protected mode.
      - name: err
        type: function
        default:
        summary: |
          The function to be used as an error handle if xpcall catches an error.
      - name: args
        type: Tuple
        default:
        summary: |
          Additional arguments passed to `f` when it is called.
    returns:
      - type: bool
        summary: |
          `true` if `f` executed without errors, `false` otherwise.
      - type: Variant
        summary: |
          All return values of `f` on success, or the result of
          `err(errorObject)` on failure.
    tags: []
    code_samples: []
    deprecation_message: ''
