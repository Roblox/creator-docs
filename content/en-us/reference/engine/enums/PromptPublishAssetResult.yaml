description: |
  Describes the result of an `Class.AssetService:PromptCreateAssetAsync()` call.
  The result is returned to the experience server after the publish flow
  completes, regardless of whether the publish succeeded or failed.

  This enum was also used with the now-deprecated `OpenPublishResultModal`
  event. The current equivalent is `Enum.PromptCreateAssetResult`, which is
  returned by the `OpenCreateResultModal` event and is the result type for
  `Class.AssetService:PromptCreateAssetAsync()`.
