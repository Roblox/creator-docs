description: |
  Describes the type of user-interaction or system event that occurred on the
  immersive ad UI overlay of an `Class.AdGui`. These values are passed to
  `HandleLuaUIEvent()` to notify the engine of player actions on ad playback
  controls (play, pause, volume, fullscreen, close) or programmatic state
  changes (play/pause triggered by the system).
