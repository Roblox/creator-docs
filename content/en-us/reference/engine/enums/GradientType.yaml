name: GradientType
type: enum
summary: |
  Specifies the shape of a gradient applied by a `Class.UIGradient`.
description: |
  Determines the geometric shape used when blending the colors and transparency
  of a `Class.UIGradient`. Read from `Class.UIGradient.Type`, which defaults to
  `Enum.GradientType.Linear`.

  - `Enum.GradientType.Linear` — colors transition along a straight line across
    the UI element, controlled by `Class.UIGradient.Rotation` and
    `Class.UIGradient.Offset`.
  - `Enum.GradientType.Radial` — colors radiate outward from a center point,
    with `Class.UIGradient.Offset` shifting the center and
    `Class.UIGradient.Scale` controlling the spread radius.
  - `Enum.GradientType.Conical` — colors sweep angularly around a center point
    (like a pie chart), with `Class.UIGradient.Rotation` setting the start angle
    and `Class.UIGradient.Offset` shifting the pivot.
