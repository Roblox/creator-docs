description: |
  `Class.PackageService` manages packages in Roblox Studio. A package is a
  reusable asset built from an instance tree that keeps a link back to its
  source asset so changes can be published to and pulled from every place that
  uses it.

  The service tracks lightweight metadata for each package, including its latest
  published version number, the creator's identity, and the current user's
  access permissions. It also drives operations on package contents: requesting
  and loading a package's instances, checking whether a package has been
  modified relative to its published version, and updating a package tree to a
  newer version or reverting it to its published state.
