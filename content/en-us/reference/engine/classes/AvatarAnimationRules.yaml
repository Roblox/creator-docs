properties:
  - name: AvatarAnimationRules.AnimationPacksMode
    summary: |
      Whether characters play the player's own animation packs, the standard R15
      animations, or R6-style animations.
    description: |
      Determines which animations the character's default `Animate` script
      plays:

      - `Enum.AvatarSettingsAnimationPacksMode.PlayerChoice`, the default: the
        player's equipped animation packs.
      - `Enum.AvatarSettingsAnimationPacksMode.StandardR15`: the standard R15
        animations.
      - `Enum.AvatarSettingsAnimationPacksMode.StandardR6`: classic R6-style
        animations, played on the character's R15 rig.

      `Enum.AvatarSettingsAnimationPacksMode.PlayerChoice` and
      `Enum.AvatarSettingsAnimationPacksMode.StandardR15` work through
      `Class.StarterPlayer.AllowCustomAnimations`. Each time rules are applied
      to a character with an R15 rig, that property is set to `false` for
      `Enum.AvatarSettingsAnimationPacksMode.StandardR15` and to `true`
      otherwise. When the experience's own Avatar Settings are applied and set
      `Enum.AvatarSettingsAnimationPacksMode.StandardR15` together with custom
      animation clips, it's set to `true` instead.

      Every spawn of an R15 rig that uses the experience's Avatar Settings
      counts as an application. Because the property is shared by the whole
      experience, the most recent application decides it for every character
      whose `Animate` script reads it. A
      `Enum.AvatarSettingsAnimationPacksMode.StandardR15` tree applied to one
      character therefore switches every such character to the standard
      animations, until the next spawn under different rules switches them back.

      For a consistent result, set
      `Enum.AvatarSettingsAnimationPacksMode.StandardR15` in the experience's
      Avatar Settings instead.

      `Enum.AvatarSettingsAnimationPacksMode.StandardR6` writes the R6-style
      animation IDs into the `Animation` objects of this character's `Animate`
      script only.
