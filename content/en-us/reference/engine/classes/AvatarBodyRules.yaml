name: AvatarBodyRules
type: class
memory_category: Instances
summary: |
  Avatar rules that limit a character's height and body scales.
description: |
  **AvatarBodyRules** holds the body settings of an `Class.AvatarRules` tree,
  the scriptable counterpart of the **Body** section of
  [Avatar Settings](../../../studio/avatar-settings.md#body). It takes effect
  only as a child of an `Class.AvatarRules` that is applied to a character with
  an R15 rig.

  Body rules apply in two steps:

  1. When `Class.AvatarBodyRules.BuildMode|BuildMode` is
     `Enum.AvatarSettingsBuildMode.CustomBuild`, each body scale is clamped into
     its `CustomBuild` range.
  2. When `Class.AvatarBodyRules.ScaleMode|ScaleMode` is
     `Enum.AvatarSettingsScaleMode.CustomScale`, the character is then scaled to
     fit `Class.AvatarBodyRules.CustomWorldHeight|CustomWorldHeight`.
