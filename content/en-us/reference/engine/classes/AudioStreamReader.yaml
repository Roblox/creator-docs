name: AudioStreamReader
type: class
memory_category: Internal
summary: |
  Reads audio samples from a connected audio stream into Luau buffers for custom
  analysis.
description: |
  `Class.AudioStreamReader` reads audio samples from a connected audio stream
  into Luau buffers, enabling custom analysis such as beat detection, pitch
  detection, or spectral processing. It provides a single **Input** pin and does
  not produce any output streams.

  The reader maintains an internal ring buffer whose size is controlled by
  `Class.AudioStreamReader.WindowSize|WindowSize`. Incoming audio accumulates in
  the buffer and can be consumed with `Class.AudioStreamReader:Read|Read()` or
  observed non-destructively with `Class.AudioStreamReader:Peek|Peek()`.

  Note that `Class.AudioStreamReader` can only be used in Roblox Studio and
  cannot be used in Team Create sessions.
