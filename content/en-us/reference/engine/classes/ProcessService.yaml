summary: |
  Gives a running script access to the host command-line process, including its
  arguments, environment variables, and exit code.
description: |
  `Class.ProcessService` lets a Luau script running under the Roblox
  command-line interface (CLI) runtime interact with the host process that
  launched it. It exposes the command-line arguments passed to the script and
  the environment variables the host makes available, lets the script set the
  process exit code, and can terminate the process outright.

  This service is specific to the command-line runtime and is not present in the
  Studio, client, or server runtimes.
