summary: |
  Provides information about an in-progress drag for the drag events that
  plugins can respond to.
description: |
  `Class.PluginDragEvent` provides information about a drag-and-drop operation
  that a plugin can respond to. An instance of it is passed as the argument to
  the `Class.PluginGui` drag events (`Class.PluginGui.PluginDragEntered`,
  `Class.PluginGui.PluginDragMoved`, `Class.PluginGui.PluginDragLeft`, and
  `Class.PluginGui.PluginDragDropped`) which fire as a drag started with
  `Class.Plugin:StartDrag()` moves over, into, out of, or is released on a
  plugin widget.

  It carries the `Class.PluginDragEvent.Sender|Sender`,
  `Class.PluginDragEvent.MimeType|MimeType`, and
  `Class.PluginDragEvent.Data|Data` originally supplied to
  `Class.Plugin:StartDrag()`, along with the
  `Class.PluginDragEvent.Position|Position` of the cursor within the widget
  receiving the drag.
