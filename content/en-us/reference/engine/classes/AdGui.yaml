name: AdGui
type: class
memory_category: Internal
summary: |
  A surface-based GUI that displays immersive ads on a face of a `Class.Part` in
  the 3D world.
description: |
  `Class.AdGui` is a `Class.SurfaceGuiBase` that renders immersive display ads
  onto a face of the `Class.Part` it's adorned to. When no ad is available, it
  shows the developer-supplied `Class.AdGui.FallbackImage`, or a default Roblox
  fallback image when that property is empty.

  To render ads, the `Class.AdGui` must be adorned to a block `Class.Part`
  that's a descendant of `Class.Workspace`, must be the only surface GUI on that
  face, and must be at least the minimum eligible size. When these conditions
  aren't met, the object displays a placeholder image in Studio's edit view and
  renders nothing in a running experience.
