description: |
  `Class.CoreGuiConfiguration` is a service that groups the per-element
  configuration objects controlling Roblox's built-in `Class.CoreGui` elements.
  When it is added to the data model, it automatically creates one child of each
  configuration type — `Class.PlayerListConfiguration`,
  `Class.CapturesViewConfiguration`, and `Class.SelfViewConfiguration` — and
  exposes each of them through a property of the same name.

  Each child configuration object inherits
  `Class.BaseCoreGuiConfiguration.Enabled|Enabled` to toggle whether its
  corresponding core GUI element is displayed.
