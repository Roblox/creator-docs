name: ParticleEmitter2D
type: class
memory_category: Instances
summary: |
  A special object that emits customizable 2D particles from a
  `Class.GuiObject`.
description: |
  A `ParticleEmitter2D` is a special object that emits customizable 2D particles
  for use in UI. To emit and render particles, it must be parented to a
  `Class.GuiObject`, such as within a `Class.ScreenGui`, `Class.SurfaceGui`, or
  `Class.BillboardGui`. Particles spawn from the very top layer of the parent
  `Class.GuiObject`, above its strokes and inset shadows.

  Particles emit automatically when the emitter is
  `Class.ParticleEmitter2D.Enabled|Enabled` with a non-zero
  `Class.ParticleEmitter2D.Rate|Rate`, or manually when the
  `Class.ParticleEmitter2D:Emit()|Emit` method is called. By default, particles
  emit upward in the parent's local canvas direction. The parent's rotation is
  inherited and combined with
  `Class.ParticleEmitter2D.EmissionAngle|EmissionAngle` and
  `Class.ParticleEmitter2D.SpreadAngle|SpreadAngle` to vary the emission
  direction further. With a non-zero `Class.ParticleEmitter2D.Speed|Speed`,
  particles are set in motion in that direction.

  Several properties, including `Class.ParticleEmitter2D.Size|Size`,
  `Class.ParticleEmitter2D.Speed|Speed`, and
  `Class.ParticleEmitter2D.Acceleration|Acceleration`, are measured in **offset
  units**, the logical pixel offset component of a `Datatype.UDim2` and the same
  units used by `Class.GuiObject.Size` and `Class.GuiBase2d.AbsoluteSize`. This
  differs from `Class.ParticleEmitter2D.EmissionOffset|EmissionOffset` and
  `Class.ParticleEmitter2D.EmissionSpread|EmissionSpread` which are scalar
  fractions of the `Class.GuiObject` parent's own size rather than fixed offset
  units.

  During the `Class.ParticleEmitter2D.Lifetime|Lifetime` of the particles, they
  can change appearance according to the `Class.ParticleEmitter2D.Color|Color`
  and `Class.ParticleEmitter2D.Size|Size`. Their motion can change over time
  according to the `Class.ParticleEmitter2D.Drag|Drag` and
  `Class.ParticleEmitter2D.Acceleration|Acceleration` properties, and they can
  also move as their parent moves when they are
  `Class.ParticleEmitter2D.LockedToParent|LockedToParent`.
