name: AudioStreamWriter
type: class
memory_category: Internal
summary: |
  Writes audio samples from Luau buffers into an audio stream for custom
  synthesis.
description: |
  `Class.AudioStreamWriter` writes audio samples from Luau buffers into an audio
  stream, enabling custom synthesis or effects processing. It provides a single
  **Output** pin and does not accept any input streams.

  The writer maintains an internal ring buffer whose size is controlled by
  `Class.AudioStreamWriter.WindowSize|WindowSize`. Samples written with
  `Class.AudioStreamWriter:Write|Write()` are buffered and consumed by the audio
  engine at the sample rate. Use `Class.AudioStreamWriter:Space|Space()` to
  check how many frames can be written without dropping samples.

  For read-modify-write effects processing, pair an `Class.AudioStreamReader`
  with an `Class.AudioStreamWriter` to read incoming audio, transform it in
  Luau, and write the result back into the audio graph.

  Note that `Class.AudioStreamWriter` can only be used in Roblox Studio and
  cannot be used in Team Create sessions.
