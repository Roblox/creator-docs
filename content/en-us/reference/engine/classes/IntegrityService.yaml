callbacks:
  - name: IntegrityService.EvaluatePlayerDeviceTrust
    summary: |
      Decides whether a player can stay in the server once their device trust
      level is available.
    description: |
      This callback is called once for each player, as soon as their device
      trust level is available. Use it to decide whether the player can stay in
      the server, based on `Class.Player.DeviceTrustLevel` and the `measures`
      table.

      Keep the following in mind when you assign this callback:

      - You can only assign it from a server-side `Class.Script`. Assigning it
        from a client throws an error.
      - Each place has one callback. If you assign it more than once, the last
        assignment replaces the earlier ones.
      - It runs after `Class.Players.PlayerAdded` fires, because checking the
        device takes time. When it runs, `Class.Player.DeviceTrustLevel` is
        never `Enum.PlayerDeviceTrustLevel.Pending|Pending`.
      - It can yield. The player keeps playing while it runs, so a rejected
        player can be disconnected after they've started playing.
      - If the player leaves, or your scripts remove them, before their trust
        level is available, it isn't called for that player.
      - Roblox doesn't check devices in Studio, so it isn't called during
        playtests.

      Roblox filters a custom `Message` and shortens messages that are too long.
      If filtering would change the message, Roblox shows the default message
      instead.

      Roblox doesn't kick the player in each of the following cases:

      - No script assigns the callback.
      - The callback returns `nil`, a value that isn't a table, or a table
        without a valid `Action`.
      - The callback throws an error. Roblox reports the error like any other
        script error.
      - The callback doesn't return in time.

      For code samples, see
      [device trust](../../../scripting/security/device-trust.md).
    code_samples: []
    parameters:
      - name: player
        type: Player
        default:
        summary: |
          The `Class.Player` being evaluated. Their trust level is already set
          in `Class.Player.DeviceTrustLevel` when this callback runs.
      - name: measures
        type: Dictionary
        default:
        summary: |
          A table of key-value pairs explaining the trust level of the player's
          device. A value of `true` means the device passed that measure:

          - `IsPlatformVersionSecure` &mdash; The operating system is at or
            above the minimum version that Roblox considers secure.
          - `IsPlatformBootSecure` &mdash; The operating system started in a
            secure state.
          - `IsAppSecure` &mdash; The Roblox app hasn't been tampered with.

          A measure that isn't available on the device reads `true`, so always
          check `Class.Player.DeviceTrustLevel` as well.
    returns:
      - type: PlayerDeviceTrustResult?
        summary: |
          A table that tells Roblox what to do with the player, or `nil` to keep
          them:

          - `Action` &mdash; Required. `Enum.PlayerDeviceTrustDecision.Reject`
            disconnects the player. `Enum.PlayerDeviceTrustDecision.Accept`
            keeps them.
          - `Message` &mdash; Optional. The message that a rejected player sees.
            If you omit it, Roblox shows a default message that explains how the
            player might fix their device.
