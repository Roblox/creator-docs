      teleported to. This field is populated only when the teleport was
      initiated using a legacy `Class.TeleportOptions.ReservedServerAccessCode`
      or `Class.TeleportOptions.ShouldReserveServer`. It is not populated for
      teleports that use `Class.TeleportOptions.ReservedServerId` or
      `Class.TeleportOptions.VipServerId`.

      This allows developers using legacy access codes to perform subsequent
      teleports to the same reserved server.

      For more information on how to teleport players between servers, see
      [Teleporting Between Places](../../../projects/teleport.md).
