description: |
  `Class.SelfViewConfiguration` is the configuration object for the built-in
  self view — the `Class.CoreGui` element that shows a player a preview of their
  own character within an experience. A single instance is created automatically
  as a child of the `Class.CoreGuiConfiguration` service and is reached through
  `Class.CoreGuiConfiguration.SelfViewConfiguration`.

  It inherits `Class.BaseCoreGuiConfiguration.Enabled|Enabled`, which toggles
  whether the self view is available, and adds
  `Class.SelfViewConfiguration.Open|Open`, which you can read and write to open
  or close the view.
