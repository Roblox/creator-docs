description: |
  `Class.SerializationService` converts `Class.Instance|instances` to and from
  the binary `.rbxm` model format. Call
  `Class.SerializationService:SerializeInstancesAsync()|SerializeInstancesAsync()`
  to serialize a list of instances into a `Library.buffer` of `.rbxm` content,
  and
  `Class.SerializationService:DeserializeInstancesAsync()|DeserializeInstancesAsync()`
  to reconstruct instances from such a buffer.

  Usable only from Studio plugins or Open Cloud Luau Execution Sessions.
  Attempting to serialize or deserialize non-creatable instances or services
  throws an error.

  No stability contract is offered for the `.rbxm` format; its composition may
  change at any time. Content serialized by the engine can always be
  deserialized by the engine, but parsing engine-generated `.rbxm` with
  third-party tools, or deserializing `.rbxm` generated by other means, is at
  the user's own risk.
