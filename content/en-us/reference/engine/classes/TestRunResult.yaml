name: TestRunResult
type: class
memory_category: Instances
summary: |
  The outcome of a test run started by `Class.TestService:RunTestsAsync()`.
description: |
  A `TestRunResult` is returned by `Class.TestService:RunTestsAsync()` when a
  run finishes. `Class.TestRunResult.Status|Status` is the outcome of the whole
  run, the counts say how many tests ended each way, and
  `Class.TestRunResult:GetTests()|GetTests()` returns a `Class.TestResult` for
  each test.

  A `TestRunResult` isn't an `Class.Instance` and can't be parented.

  ```lua
  local TestService = game:GetService("TestService")

  local result = TestService:RunTestsAsync()
  print(result.Summary)
  if result.Status ~= Enum.TestRunStatus.Pass then
  	for _, test in result:GetTests() do
  		if test.Status ~= Enum.TestCaseStatus.Pass and test.Status ~= Enum.TestCaseStatus.Skipped then
  			warn(`{test.TestId}: {test.Status.Name}`)
  		end
  	end
  end
  ```
