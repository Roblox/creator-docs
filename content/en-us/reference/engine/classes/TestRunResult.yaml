  - name: TestRunResult.Status
    summary: |
      The outcome of the whole run.
    description: |
      The outcome of the whole run:

      - `Enum.TestRunStatus.Pass` if at least one test passed and none failed or
        timed out.
      - `Enum.TestRunStatus.Fail` if any test failed or timed out.
      - `Enum.TestRunStatus.Skipped` if tests matched the filter but every one
        was skipped.
      - `Enum.TestRunStatus.NoTests` if no test was registered or matched the
        filter.

      To decide whether a run passed, compare
      `Class.TestRunResult.Status|Status` with `Enum.TestRunStatus.Pass`.
      Statuses may be added later, so don't treat everything other than
      `Enum.TestRunStatus.Fail` as a pass.
