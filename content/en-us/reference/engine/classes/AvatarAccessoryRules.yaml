    summary: |
      How far, as a percentage of the body's size, rigid accessories can extend
      beyond the body on each axis.
    description: |
      The bounds that rigid accessories must fit within when
      `Class.AvatarAccessoryRules.AccessoryMode|AccessoryMode` is
      `Enum.AvatarSettingsAccessoryMode.CustomLimit`. The bounds start as the
      box around the character's body, aligned with its `HumanoidRootPart`. Each
      component is a percentage of the body's size on that axis, added to both
      sides of the box. For example, `Vector3.new(50, 0, 0)` widens the box by
      half the body's width on the left and on the right.

      Defaults to `(0, 0, 0)`, the body's own box, which most hats and other
      accessories that stick out from the body exceed. An accessory is measured
      by the box around its `Handle`.
