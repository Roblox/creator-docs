name: AvatarAccessoryRules
type: class
memory_category: Instances
summary: |
  Avatar rules that turn off accessory effects and limit the size of rigid
  accessories.
description: |
  **AvatarAccessoryRules** holds the accessory settings of an
  `Class.AvatarRules` tree, the scriptable counterpart of the **Accessories**
  section of [Avatar Settings](../../../studio/avatar-settings.md#accessories).
  It takes effect only as a child of an `Class.AvatarRules` that is applied to a
  character with an R15 rig.

  The rules act on the `Class.Accessory|Accessories` that are children of the
  character when the rules are applied. Accessories added afterward aren't
  affected until rules are applied again.
