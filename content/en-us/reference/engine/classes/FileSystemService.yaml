  - name: FileSystemService:Walk
    summary: |
      Returns an iterator that traverses the entries within a directory.
    description: |
      Returns an iterator function, suitable for a generic `for` loop, that
      visits the entries contained in `folderPath`. Each iteration produces a
      table with `Path`, `IsRegularFile`, and `Depth` fields.

      When `mode` is `Enum.FileSystemWalkMode.Recursive`, the iterator descends
      into subdirectories, incrementing `Depth` for each level below
      `folderPath`. When `mode` is `Enum.FileSystemWalkMode.NonRecursive` — the
      behavior used when `mode` is omitted — only the immediate entries of
      `folderPath` are visited, each reported at `Depth` `1`.

      Requires read access; a path that resolves outside the sandbox raises an
      error.

      ```lua
      for entry in fs:Walk(folderPath, Enum.FileSystemWalkMode.Recursive) do
      	print(entry.Path, entry.IsRegularFile, entry.Depth)
      end
      ```
    code_samples: []
    parameters:
      - name: folderPath
        type: string
        default:
        summary: |
          The path of the directory to traverse.
      - name: mode
        type: FileSystemWalkMode
        default:
        summary: |
          Whether to descend into subdirectories. When omitted, traversal is
          non-recursive.
    returns:
      - type: ()
        summary: |
