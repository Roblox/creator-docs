name: FileSystemService
type: class
memory_category: Instances
summary: |
  Provides sandboxed access to the local file system for Luau scripts run
  through the Roblox command-line environment.
description: |
  `Class.FileSystemService` exposes file and directory operations — reading,
  writing, existence checks, traversal, and removal — to Luau code executing in
  Roblox's command-line (CLI) toolchain.

  Every path is first resolved to a canonical, generic (forward-slash) form, and
  each operation is checked against a sandbox that restricts which locations a
  script may access. An operation whose target resolves outside the sandbox
  raises an error rather than touching the file system. Read-only operations
  such as `Class.FileSystemService:Exists()|Exists()` and
  `Class.FileSystemService:ReadFile()|ReadFile()` require read access to the
  path, while mutating operations such as
  `Class.FileSystemService:WriteFile()|WriteFile()`,
  `Class.FileSystemService:Remove()|Remove()`,
  `Class.FileSystemService:RemoveAll()|RemoveAll()`, and
  `Class.FileSystemService:CreateDirectories()|CreateDirectories()` require
  read-write access.
