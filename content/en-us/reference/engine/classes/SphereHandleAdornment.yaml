  - name: SphereHandleAdornment.Shading
    summary: |
      Determines how the sphere adornment is shaded and whether it draws through
      geometry that would otherwise occlude it.
    description: |
      `Shading` selects the material and render pass used to draw the sphere,
      via `Enum.AdornShading`. It defaults to `Enum.AdornShading.Default`, which
      draws the sphere unlit and occluded by scene geometry like an ordinary
      world object.

      `Enum.AdornShading.Shaded` and `Enum.AdornShading.XRayShaded` light the
      sphere with the scene's lighting instead of drawing it unlit, while
      `Enum.AdornShading.XRay` and `Enum.AdornShading.XRayShaded` draw the
      sphere through geometry that would otherwise occlude it.
      `Enum.AdornShading.AlwaysOnTop` draws the sphere on top of everything else
      with no depth testing.

      The legacy `Class.HandleAdornment.AlwaysOnTop` property only takes effect
      while `Shading` is `Enum.AdornShading.Default`; any other `Shading` value
      determines the render pass on its own.
