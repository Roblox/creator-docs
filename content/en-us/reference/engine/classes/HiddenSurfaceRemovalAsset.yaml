description: |
  Engine-managed asset; its data is not exposed to scripts. Holds the hidden
  surface removal (HSR) data produced by Roblox's layered-clothing deformation
  pipeline. HSR identifies the faces of a wrap's mesh that are fully occluded by
  clothing layers worn above it, so the engine can strip those faces from the
  output geometry before rendering rather than drawing surfaces that will never
  be visible.

  The asset is stored and fetched by content ID: the engine deserializes it and
  decodes its data into the runtime visibility information consumed by the wrap
  deformer when solving a `Class.WrapLayer` or `Class.WrapTarget`.
