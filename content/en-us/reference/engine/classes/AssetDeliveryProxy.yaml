summary: |
  Runs a local HTTP server that serves assets to real devices.
description: |
  Internal service for remote asset delivery; not intended for game scripts. It
  backs the remote hot-reload workflow: `Class.IncrementalPatchBuilder` builds a
  signed patch and this proxy serves it, along with any overridden assets, over
  HTTP to the connected device. The server runs on its own thread and is
  controlled through `Class.AssetDeliveryProxy.StartServer`,
  `Class.AssetDeliveryProxy.Interface`, and `Class.AssetDeliveryProxy.Port`.
