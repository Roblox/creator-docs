name: StudioScreenshotCapture
type: class
memory_category: Instances
summary: |
  Represents a single screenshot captured from Studio, exposing the resulting
  image buffer and the parameters the capture was taken with.
description: |
  Studio-only capture result that requires plugin security — not available in
  published experiences. Produced by
  `Class.StudioCaptureService:CaptureScreenshot()|CaptureScreenshot()` and
  `CapturePluginGui()`. It holds the encoded image data together with the region
  and format used for the capture, and reports progress through
  `Class.StudioScreenshotCapture.BufferStatus|BufferStatus`.

  The image is populated asynchronously.
  `Class.StudioScreenshotCapture.BufferStatus|BufferStatus` defaults to
  `Enum.StudioCaptureBufferStatus.NotStarted`, becomes
  `Enum.StudioCaptureBufferStatus.Pending` while capturing and encoding,
  `Enum.StudioCaptureBufferStatus.Ready` once the image is available, or
  `Enum.StudioCaptureBufferStatus.Error` if capture failed. Retrieve the image
  with `Class.StudioScreenshotCapture:GetBuffer()|GetBuffer()`, read failure
  details with `Class.StudioScreenshotCapture:GetErrors()|GetErrors()`, and
  produce a resized copy with
  `Class.StudioScreenshotCapture:ScaleAsync()|ScaleAsync()`.
