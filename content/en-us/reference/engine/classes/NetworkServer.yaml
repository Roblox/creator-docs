      - name: playerId
        type: int64
        default:
        summary: |
          The `Class.Player.UserId` of the connected player whose session key is
          used to encrypt the string.
    returns:
      - type: string
        summary: |
          The session-encrypted string, or an empty string if no player with the
          given `playerId` is currently connected.
