  - name: NetworkServer:EncryptStringForPlayerId
    summary: |
      Encrypts a string with the session key of the connection belonging to the
      player with the given `playerId`, returning the ciphertext.
    description: |
      Encrypts `toEncrypt` using the per-session encryption key of the connected
      player whose `Class.Player.UserId` equals `playerId`, then returns the
      ciphertext. Only that player's client can decrypt the result.

      This supports the encrypted-assets workflow: the server session-encrypts
      an asset encryption key for a single player, and that client decrypts and
      registers it through
      `Class.ContentProvider:RegisterSessionEncryptedAsset()` (or
      `Class.ContentProvider:RegisterDefaultSessionKey()`), so the raw key is
      never transmitted in plain text.

      Returns an empty string when no player with the given `playerId` is
      currently connected.
