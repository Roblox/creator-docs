name: AnimationNodeDefinition
type: class
memory_category: Instances
summary: |
  A single node within an animation graph that outputs an animation pose,
  connected to other nodes through named input pins.
description: |
  Represents one node in an animation graph, the node-based system that combines
  animation clips and poses at runtime. Its
  `Class.AnimationNodeDefinition.NodeType|NodeType` determines how the node
  processes animation, such as playing a clip, blending or overlaying two
  inputs, masking, or adjusting playback speed, while its
  `Class.AnimationNodeDefinition.NodeId|NodeId` uniquely identifies it within
  the graph. Nodes connect to one another through named input pins; changing a
  node's type resets its input pins to the default set for that type. For a node
  that outputs one or more values instead of a pose, see
  `Class.AnimationValueNodeDefinition`.

  #### Connecting nodes

  To connect the pose of another `Class.AnimationNodeDefinition` to an input of
  this node, parent an `Class.ObjectValue` to this node, set its
  `Class.ObjectValue.Value|Value` to the source node, and name it after the
  input pin. Every pose connection's pin name must also appear in this node's
  ordered input pin list. Wires from value nodes don't use input pins; see
  `Class.AnimationValueOutputDefinition`.

  - Node types with fixed inputs, such as `Enum.AnimationNodeType.AddNode`,
    `Enum.AnimationNodeType.SubtractNode`, and
    `Enum.AnimationNodeType.GraphOutput`, already have their pins in the list.
    Name the `Class.ObjectValue` after one of them, for example `Base` or
    `Pose`.
  - Node types with a variable number of inputs, such as
    `Enum.AnimationNodeType.Blend1DNode`, `Enum.AnimationNodeType.Blend2DNode`,
    `Enum.AnimationNodeType.SelectNode`, and
    `Enum.AnimationNodeType.SequenceNode`, start with an empty list. Call
    `Class.AnimationNodeDefinition:AddInputPin()|AddInputPin()` for each
    connection, or
    `Class.AnimationNodeDefinition:SetOrderedInputPinNames()|SetOrderedInputPinNames()`
    for all of them at once.

  Set `Class.AnimationNodeDefinition.NodeType|NodeType` before adding pins,
  since changing it resets the list. Give each node a
  `Class.AnimationNodeDefinition.NodeId|NodeId` that is unique within the graph,
  such as one from `Class.HttpService:GenerateGUID()`; a node without one logs a
  warning when the graph is built.

  A connection whose pin is missing from the list never plays on nodes that look
  up their inputs by name, such as `Enum.AnimationNodeType.AddNode` and
  `Enum.AnimationNodeType.SubtractNode`. Other nodes still play it, but evaluate
  it after all listed inputs, and Studio's animation graph editor doesn't
  display it as an input of the node.

  Node properties, such as a clip's `AnimationId`, are attributes on the node.
  Properties of a single input, such as the `Position` of a
  `Enum.AnimationNodeType.Blend1DNode` input, are attributes on that input's
  `Class.ObjectValue`.
