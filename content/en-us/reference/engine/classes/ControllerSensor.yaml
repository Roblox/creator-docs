description: |
  `Class.ControllerSensor` is an abstract base class for `Class.SensorBase`
  types whose output is intended to be consumed by a physics-based character
  controller such as a `Class.ControllerManager`. A `Class.ControllerManager`
  reads its `Class.ControllerManager.GroundSensor` and
  `Class.ControllerManager.ClimbSensor`, both of which are
  `Class.ControllerSensor|ControllerSensors`, to determine how its
  `Class.ControllerManager.RootPart` interacts with the world.

  `Class.ControllerSensor` adds no members of its own; it groups the concrete
  sensor types that provide controller-relevant data, such as
  `Class.ControllerPartSensor`, which detects floors and ladders using the same
  logic as a `Class.Humanoid`. Because it is abstract, you don't create a
  `Class.ControllerSensor` directly; use one of its subclasses instead.
