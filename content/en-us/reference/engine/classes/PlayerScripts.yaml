  - name: PlayerScripts:RegisterComputerCameraMovementMode
    summary: |
      Registers that a computer camera movement mode is available to be selected
      from the game menu.
    description: |
      Adds `cameraMovementMode` to the set of `Enum.ComputerCameraMovementMode`
      options a player can select in the in-experience settings menu on
      mouse-and-keyboard devices. A new `Class.PlayerScripts` instance is
      pre-populated with the default computer camera modes
      (`Enum.ComputerCameraMovementMode.Default`,
      `Enum.ComputerCameraMovementMode.Classic`, and
      `Enum.ComputerCameraMovementMode.Follow`); the first call to this method
      clears that default set so that only the modes you explicitly register are
      offered, and each later call adds one more. Registering a mode notifies
      the settings menu so its list of camera options updates.
