description: |
  `PluginManagerInterface` is the singleton object returned by the global
  `PluginManager()` function, which can be called from a plugin or from Studio's
  [Command Bar](../../../studio/ui-overview.md#command-bar). It provides a small
  set of legacy Studio utilities for exporting geometry —
  `Class.PluginManagerInterface:ExportPlace()` and
  `Class.PluginManagerInterface:ExportSelection()` — along with the deprecated
  `Class.PluginManagerInterface:CreatePlugin()` method. Calling the
  `PluginManager()` global requires plugin security.
