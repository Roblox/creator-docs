      Communicates to Studio that the identified recording is finished and to
      take the final operation to complete the recording.
    description: |
      Completes a recording that was started with
      `Class.ChangeHistoryService:TryBeginRecording()|TryBeginRecording()`. Pass
      the `identifier` returned by that call along with an
      `Enum.FinishRecordingOperation` describing what to do with the recorded
      changes:

      - `Enum.FinishRecordingOperation.Commit` adds the changes to the undo/redo
        history as a new waypoint.
      - `Enum.FinishRecordingOperation.Cancel` discards the recording and
        reverts the changes it captured. The `identifier` is ignored for this
        operation, so a plugin can cancel its own in-progress recording without
        knowing the identifier.
      - `Enum.FinishRecordingOperation.Append` merges the recording into the
        waypoint that immediately precedes it rather than creating a new one.

