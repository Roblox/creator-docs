description: |
  Studio-only Terrain Editor service; members require elevated security and are
  not callable from experience scripts. Powers **Import Heightmap**: given a
  `Datatype.Region3` and the asset IDs of a grayscale heightmap plus an optional
  colormap, samples the images and generates smooth-voxel `Class.Terrain` in
  that region — heightmap luminance drives height; colormap colors map to the
  nearest terrain `Enum.Material`, falling back to a supplied default and
  warning when too many pixels are unmatched.
