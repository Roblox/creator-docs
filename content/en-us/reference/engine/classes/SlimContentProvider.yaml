description: |
  Not intended for use from experience scripts. `Class.SlimContentProvider`
  retrieves SLIM (Scalable Lightweight Interactive Models) asset content
  representations, parses them into mesh and level-of-detail metadata for the
  model rendering pipeline, and signals when an asset is ready, needs a retry,
  or has failed.

  As a variant of `Class.CacheableContentProvider`, it caches parsed results
  under a memory budget and evicts least-recently-used entries when the budget
  is exceeded.
