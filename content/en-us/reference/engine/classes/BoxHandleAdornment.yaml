properties:
  - name: BoxHandleAdornment.Shading
    summary: |
      Determines how the box adornment is shaded and whether it draws through
      geometry that would otherwise occlude it.
    description: |
      `Shading` selects the material and render pass used to draw the box, using
      a value of the `Enum.AdornShading` enum. It defaults to
      `Enum.AdornShading|Default`, which draws the box unlit and occluded by
      scene geometry like an ordinary world object.

      `Enum.AdornShading|Shaded` and `Enum.AdornShading|XRayShaded` light the
      box with the scene's lighting instead of drawing it unlit, while
      `Enum.AdornShading|XRay` and `Enum.AdornShading|XRayShaded` draw the box
      through geometry that would otherwise occlude it.
      `Enum.AdornShading|AlwaysOnTop` draws the box on top of everything else
      with no depth testing.

      The legacy `Class.HandleAdornment.AlwaysOnTop` property only takes effect
      while `Shading` is `Enum.AdornShading|Default`; any other `Shading` value
      determines the render pass on its own.
