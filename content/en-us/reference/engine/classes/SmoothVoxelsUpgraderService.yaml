name: SmoothVoxelsUpgraderService
type: class
memory_category: Instances
summary: |
  A service that converts a place's legacy smooth terrain voxels into the newer
  signed-distance-field (SDF) representation.
description: |
  This service backs Studio's terrain-upgrade tooling rather than in-experience
  scripting, and its members are restricted to Roblox-authored scripts.

  `Class.SmoothVoxelsUpgraderService` performs a one-time, in-place conversion
  of the `Class.Workspace`'s smooth `Class.Terrain` from the legacy
  occupancy-based voxel format to the newer signed-distance-field (SDF)
  representation. The conversion runs asynchronously: the service walks every
  non-empty terrain chunk with its neighbors, remeshes each chunk, and
  re-voxelizes the geometry into SDF cells while preserving solid materials and
  water. When finished, the terrain is flagged as upgraded and a
  `Class.ChangeHistoryService` waypoint named "Upgrade Smooth Terrain" is
  recorded so the operation can be undone.

  The service can start an upgrade, request cancellation of one in progress, and
  report progress through a status signal: a ratio from 0 to 1 during
  conversion, a value greater than 1 when complete, and a negative value if
  canceled.
