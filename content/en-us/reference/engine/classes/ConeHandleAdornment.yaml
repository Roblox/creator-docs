  - name: ConeHandleAdornment.Shading
    summary: |
      Determines how the cone adornment is shaded and whether it draws through
      geometry that would otherwise occlude it.
    description: |
      Selects the material and render pass used to draw the cone via
      `Enum.AdornShading`. Defaults to `Enum.AdornShading|Default`, which draws
      the cone unlit and occluded by scene geometry.

      `Enum.AdornShading|Shaded` and `Enum.AdornShading|XRayShaded` light the
      cone with the scene's lighting. `Enum.AdornShading|XRay` and
      `Enum.AdornShading|XRayShaded` draw through occluding geometry.
      `Enum.AdornShading|AlwaysOnTop` draws on top of everything with no depth
      testing.

      The legacy `Class.HandleAdornment.AlwaysOnTop` property only applies while
      `Shading` is `Enum.AdornShading|Default`; any other value controls the
      render pass on its own.
