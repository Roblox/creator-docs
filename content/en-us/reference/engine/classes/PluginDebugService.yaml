description: |
  Studio-only service for plugin debugging — not available in published games.
  It holds the `Class.Plugin` instances currently being debugged and parents
  them into the data model so the debugger can treat stepped scripts as
  data-model descendants, while keeping them out of serialization and under
  Studio Explorer visibility control.

  Only a `Class.Plugin` marked as debuggable can be parented here; any other
  child raises an error. Debugging is opt-in through Studio settings and applies
  only to local plugins the user placed in their local plugins directory.
