name: InputActionLabel
type: class
memory_category: Gui
summary: |
  A `Class.GuiObject` that automatically displays the keybinding for an action
  as text or an image.
description: |
  `InputActionLabel` is a drag-and-drop `Class.GuiObject` that automatically
  shows the appropriate key or icon for an `Class.InputAction` based on the
  player's current input device (keyboard/mouse, gamepad, touch, VR). When the
  player switches devices or the binding is rebound, the label updates instantly
  without scripting.

  Rendering of the `InputActionLabel` depends on the `Class.InputAction` (linked
  through `Class.InputActionLabel.InputAction`) and that action's child
  `Class.InputBinding|InputBindings`. As the label resolves what to show, it
  follows this order:

  1. **Custom Images** — If child `Class.InputBinding|InputBindings` have their
     `Class.InputBinding.DisplayImage|DisplayImage` property set, the label
     renders those images directly, optionally modified by
     `Class.InputActionLabel.ImageColor3|ImageColor3` and
     `Class.InputActionLabel.ImageTransparency|ImageTransparency`.

  2. **Platform Key Images** — Lacking custom images, the label renders
     platform-provided images for child `Class.InputBinding|InputBindings`
     through `Class.UserInputService:GetImageForKeyCode()`, if such images are
     available. Composite bindings with modifiers show multiple icons with `+`
     separators.

  3. **Custom Names** — Lacking available images, if child
     `Class.InputBinding|InputBindings` have their
     `Class.InputBinding.DisplayName|DisplayName` property set, the label
     renders that text in a style defined by
     `Class.InputActionLabel.FontFace|FontFace`,
     `Class.InputActionLabel.TextColor3|TextColor3`,
     `Class.InputActionLabel.TextSize|TextSize`,
     `Class.InputActionLabel.TextTransparency|TextTransparency`,
     `Class.InputActionLabel.TextWrapped|TextWrapped`,
     `Class.InputActionLabel.TextXAlignment|TextXAlignment`, and
     `Class.InputActionLabel.TextYAlignment|TextYAlignment`.

  4. **Platform Key Strings** — Lacking all of the above, the label renders
     platform-provided strings through
     `Class.UserInputService:GetStringForKeyCode()`.

  5. If no `Class.InputAction` is assigned or no child `Class.InputBinding`
     exists, the label renders a placeholder icon.
