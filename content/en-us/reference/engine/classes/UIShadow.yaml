name: UIShadow
type: class
memory_category: Instances
summary: |
  Renders configurable shape or text shadows for the parent UI instance.
description: |
  `UIShadow` renders a shadow for its parent UI instance. Key features include:

  - Adjust the shadow's blurriness with `Class.UIShadow.BlurRadius|BlurRadius`.
  - Adjust the shadow's color and transparency with `Class.UIShadow.Color|Color`
    and `Class.UIShadow.Transparency|Transparency`.
  - Adjust the shadow's position and size relative to the parent with
    `Class.UIShadow.Offset|Offset` and `Class.UIShadow.Spread|Spread`.
  - Add multiple shadows under the same parent and adjust their render order
    with `Class.UIShadow.ZIndex|ZIndex`.
  - Add a shadow to the text in `Class.TextLabel`, `Class.TextButton`, or
    `Class.TextBox` with `Class.UIShadow.Mode|Mode`.
  - Add an inset shadow with `Class.UIShadow.Inset|Inset`.
  - Hide the part of the shadow directly behind the parent with
    `Class.UIShadow.ShowBehindParent|ShowBehindParent`.
  - Apply a gradient to a shadow's color with a child `Class.UIGradient`.
  - If the parent is rotated with `Class.GuiObject.Rotation`, the shadow will
    also be rotated.
  - If the parent has round corners with `Class.UICorner`, the shadow will also
    have round corners.

  #### Limitations

  - `UIShadow` does not support `Class.Path2D`.
  - You cannot apply textures to a `UIShadow`.
