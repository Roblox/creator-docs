  - name: MemStorageConnection:Disconnect
    summary: |
      Ends the binding so its callback no longer runs when the associated
      memory-storage key changes.
    description: |
      Detaches the connection from its parent `Class.MemStorageService` and
      disconnects the underlying subscription, so the callback supplied when the
      connection was created is no longer invoked when the key is updated. This
      is also called automatically when the `Class.MemStorageConnection` is
      destroyed. Once disconnected, a connection cannot be re-established; bind
      again to resume receiving updates.
