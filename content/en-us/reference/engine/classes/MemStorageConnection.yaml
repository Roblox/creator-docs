name: MemStorageConnection
type: class
memory_category: Instances
summary: |
  Represents a live binding created by `Bind()` on `Class.MemStorageService`
  that runs a callback whenever a memory-storage key changes.
description: |
  A `MemStorageConnection` is the object returned by the `Bind()` and
  `BindAndFire()` methods of `Class.MemStorageService`. It wraps the underlying
  subscription to a memory-storage key: while the connection is retained, the
  callback supplied at bind time is invoked on each update to that key. The
  connection is parented to the `Class.MemStorageService` that created it.
  Calling `Class.MemStorageConnection:Disconnect()`, or allowing the object to
  be destroyed, detaches it and stops any further callbacks.
