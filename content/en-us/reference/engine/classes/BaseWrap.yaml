    description: |
      The cage mesh this wrap uses to deform geometry, stored as a
      `Datatype.Content` value that can reference an uploaded mesh asset or an
      in-memory `Class.EditableMesh`. Set automatically by the Importer. It is
      the backing store for `Class.BaseWrap.CageMeshId`: that property reads the
      mesh ID from this content, and setting either keeps both in sync and
      raises a change on both.

