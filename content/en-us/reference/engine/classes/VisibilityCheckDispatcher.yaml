  Not accessible from scripts. `Class.VisibilityCheckDispatcher` measures the
  viewability of on-screen ads, such as those rendered by `Class.AdGui`. On
  every `Class.RunService` heartbeat, it selects pending ad instances and runs
  the on-screen and occlusion checks that determine whether an ad impression
  should be counted, then reports the results through `Class.AdService`.

