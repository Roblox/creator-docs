  - name: BaseScript.Disabled
    summary: |
      Determines whether a `Class.BaseScript` runs or not.
    description: |
      Determines whether a `Class.BaseScript` runs or not.

      Setting this property to true while the script is running drops its
      references to the script's thread; a thread that is yielded (or that
      yields later) is never resumed and becomes eligible for garbage
      collection. A thread that is actively executing continues to run until it
      next yields or returns.

      If this property is changed from true to false, a fresh run of the script
      is started. This means that `Class.BaseScript.Disabled|Disabled` can be
      toggled to restart a script.
