      returns the same `Datatype.CFrame` as `Class.PVInstance:GetPivot()`. It
      has no stored value of its own and always reflects the current pivot.

      Setting it from the Properties window moves the whole instance so its
      pivot lands at the new `Datatype.CFrame`, much like
      `Class.PVInstance:PivotTo()`. Editing through the Properties window
      temporarily disables `Class.WeldConstraint|WeldConstraints` to other
      objects for the move; `PivotTo` does not modify joints.

      Not available to scripts; use `Class.PVInstance:GetPivot()` and
      `Class.PVInstance:PivotTo()` at runtime instead.
