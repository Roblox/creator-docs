name: AvatarRules
type: class
memory_category: Instances
summary: |
  A container of avatar rules objects that can be applied to a character in
  place of the experience's Avatar Settings.
description: |
  **AvatarRules** is the root of a tree of avatar rules: the same settings as
  the experience's [Avatar Settings](../../../studio/avatar-settings.md), held
  in instances that scripts can create and apply to individual characters. It
  has no settings of its own. Each category of settings is a child object, and
  an **AvatarRules** can hold at most one of each:

  - `Class.AvatarBodyRules`: body height and body scale limits.
  - `Class.AvatarAnimationRules`: which animation pack characters use.
  - `Class.AvatarCollisionRules`: how the character collides and detects
    touches.
  - `Class.AvatarAccessoryRules`: accessory effects and size limits.
  - `Class.AvatarClothingRules`: layered clothing size limits.

  The category objects accept no children. Any other child, a second object of
  the same category, or a child of a category object makes the tree invalid, and
  applying an invalid tree raises an error that names the problem. A tree must
  contain at least one category object.

  You can apply a tree in three ways:

  - `Class.Humanoid:ApplyAvatarRulesAsync()` applies it to an existing
    character.
  - `Class.Player:LoadCharacterWithAvatarRulesAsync()` spawns a player's
    character with it.
  - Parent it to a `Class.HumanoidDescription` whose
    `Class.HumanoidDescription.UseAvatarSettings|UseAvatarSettings` is `true`;
    the tree is used whenever that description is applied. The description can
    have at most one **AvatarRules** child.

  An applied tree replaces the experience's Avatar Settings for that character.
  It isn't merged with them, so a category the tree omits uses that category's
  default values rather than the experience's settings.

  Rules are read only when they're applied. Changing a property afterward
  doesn't affect characters that already have the rules; apply the tree again or
  respawn the character.

  The properties on these objects take effect only on characters with an R15
  rig.

  Instead of an **AvatarRules** instance, both methods also accept a table with
  the same structure, keyed by class and property name:

  ```lua
  local Players = game:GetService("Players")

  Players.PlayerAdded:Connect(function(player)
  	player:LoadCharacterWithAvatarRulesAsync({
  		AvatarRules = {
  			AvatarBodyRules = {
  				ScaleMode = Enum.AvatarSettingsScaleMode.CustomScale,
  				CustomWorldHeight = NumberRange.new(5, 6),
  			},
  		},
  	})
  end)
  ```
