  - name: ProximityPromptService.MaxIndicatorsVisible
    summary: |
      Maximum number of prompt indicators that can be visible at once.
    description: |
      This property sets the maximum number of prompt indicators that can be
      visible at the same time. Indicators are lightweight distance hints shown
      for `Class.ProximityPrompt|ProximityPrompts` when the player is within the
      prompt's `Class.ProximityPrompt.MaxIndicatorDistance|MaxIndicatorDistance`
      but still outside its
      `Class.ProximityPrompt.MaxActivationDistance|MaxActivationDistance`.

      This property defaults to `16` and is clamped to the range `[0, 64]`.
      Because indicators are opt-in per prompt — a prompt's
      `Class.ProximityPrompt.MaxIndicatorDistance|MaxIndicatorDistance` defaults
      to `0`, which disables its indicator — this property has no visible effect
      unless at least one prompt sets a non-zero
      `Class.ProximityPrompt.MaxIndicatorDistance|MaxIndicatorDistance`.
