    summary: |
      Triggers client-side when a prompt's indicator becomes visible.
    description: |
      This event triggers client-side in connected local scripts when the
      indicator for a `Class.ProximityPrompt` becomes visible, which happens
      when the player moves within the prompt's
      `Class.ProximityPrompt.MaxIndicatorDistance|MaxIndicatorDistance` but
