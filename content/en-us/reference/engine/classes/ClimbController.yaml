name: ClimbController
type: class
memory_category: Instances
summary: |
  A physics character controller that moves its
  `Class.ControllerManager.RootPart` along a climbable surface, such as a
  ladder.
description: |
  `Class.ClimbController` is a `Class.ControllerBase` that produces climbing
  movement for a physics-based character. When it is assigned as the
  `Class.ControllerManager.ActiveController` of a `Class.ControllerManager`, the
  manager applies constraints each simulation step that move the
  `Class.ControllerManager.RootPart` across the climbed surface while keeping it
  upright and aligned to that surface. Movement follows the surface reported by
  the manager's climb sensor (`Class.ControllerManager.ClimbSensor`); if the
  manager has no climb sensor detecting a surface, the controller has no effect.
  The direction and target speed come from the requested move velocity scaled by
  `Class.ControllerBase.MoveSpeedFactor`, while the
  `Class.ClimbController.MoveMaxForce`, `Class.ClimbController.BalanceSpeed`,
  and `Class.ClimbController.BalanceMaxTorque` properties tune how forcefully
  and how quickly the root part moves and re-aligns.
