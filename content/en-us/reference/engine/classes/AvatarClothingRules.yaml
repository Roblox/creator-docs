  - name: AvatarClothingRules.LimitBounds
    summary: |
      How far, as a percentage of the body's size, layered clothing can extend
      beyond the body on each axis.
    description: |
      The bounds that layered clothing must fit within when
      `Class.AvatarClothingRules.ClothingMode|ClothingMode` is
      `Enum.AvatarSettingsClothingMode.CustomLimit`. The bounds start as the box
      around the character's body. Each component is a percentage of the body's
      size on that axis, added to both sides of the box. For example,
      `Vector3.new(0, 0, 25)` deepens the box by a quarter of the body's depth
      in front and behind.

      Defaults to `(0, 0, 0)`, the body's own box, so an item that extends past
      the body on any axis isn't shown.
