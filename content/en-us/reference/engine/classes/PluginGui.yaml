methods:
  - name: PluginGui:BindToClose
    summary: |
      Binds a function that runs when the user closes the `Class.PluginGui`.
    description: |
      This method binds a function that runs when the user clicks the close
      button of the `Class.PluginGui`. The widget closes and its
      `Class.LayerCollector.Enabled|Enabled` property becomes `false` even when
      a function is bound, so the function can't prevent or delay closing. Use
      it to perform tasks such as saving work when the widget closes.

      For example, the following code saves work when the user closes the
      widget:

      ```lua
      local function saveWork()
      	-- Save the user's work here.
      end

      pluginGui:BindToClose(function()
      	saveWork()
      end)
      ```

      Call `BindToClose()` without an argument to unbind the current function:

      ```lua
      pluginGui:BindToClose()
      ```

      See also:

      - `Class.Plugin:CreateDockWidgetPluginGuiAsync()` to create a
        `Class.PluginGui`
      - `Class.DataModel:BindToClose()`, which can be used to bind a function to
        the game ending and should not be confused with this function
    code_samples: []
    parameters:
      - name: function
        type: Function
        default: nil
        summary: |
          The function to bind the close button to. If no function is specified
          then any previously specified function will be unbound.
    returns:
