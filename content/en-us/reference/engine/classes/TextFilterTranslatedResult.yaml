description: |
  A `Class.TextFilterTranslatedResult` is the object returned by
  `Class.TextService:FilterAndTranslateStringAsync()`. It bundles the filtered
  source text together with filtered translations of that text into each
  requested target locale.

  Read `Class.TextFilterTranslatedResult.SourceText` and
  `Class.TextFilterTranslatedResult.SourceLanguage` for the filtered original
  text and its language, call
  `Class.TextFilterTranslatedResult:GetTranslationForLocale()` to retrieve the
  filtered translation for a single locale, or call
  `Class.TextFilterTranslatedResult:GetTranslations()` to retrieve all of them
  at once.

  Instances of this class cannot be created, parented, or replicated; they are
  only produced by the engine as the return value of the filtering call. That
  call, `Class.TextService:FilterAndTranslateStringAsync()`, is deprecated, so
  new work should filter and translate chat through `Class.TextChatService`
  instead.
