description: |
  `Class.ControllerBase` is the abstract base class for the controllers that a
  `Class.ControllerManager` uses to move its assigned character:
  `Class.GroundController`, `Class.AirController`, `Class.SwimController`, and
  `Class.ClimbController`. Each controller is parented to a
  `Class.ControllerManager` and supplies the movement and balance behavior for
  one locomotion state, and the manager activates one controller at a time. This
  class isn't created directly; instead create one of its derived controllers.
  It defines the balance and movement properties shared by all of them.
