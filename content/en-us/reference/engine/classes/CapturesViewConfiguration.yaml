  `Class.CapturesViewConfiguration` is the per-element configuration object that
  controls the built-in captures view — the `Class.CoreGui` element that lets
  players browse and manage the screenshots and video captures they take within
  an experience. It's created automatically as a child of the
  `Class.CoreGuiConfiguration` service.

  It inherits `Class.BaseCoreGuiConfiguration.Enabled|Enabled` to toggle whether
  the captures view is displayed, and adds
  `Class.CapturesViewConfiguration.Open|Open` to control whether the view is
  currently open.
