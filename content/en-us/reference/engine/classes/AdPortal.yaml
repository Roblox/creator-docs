  - name: AdPortal.Status
    summary: |
      Indicates whether the portal is currently active and able to teleport
      players.
    description: |
      Reports the portal's current `Enum.AdUnitStatus`. The value is
      `Enum.AdUnitStatus.Active` only when the portal has passed validation and
      has been served an ad with a valid destination place; in every other case
      it is `Enum.AdUnitStatus.Inactive`.

      A newly created portal reports `Enum.AdUnitStatus.Inactive`, because its
      destination place is unset (`0`) until the ad service fills the portal
      with an ad — the portal cannot become `Enum.AdUnitStatus.Active`, and
      therefore cannot teleport, until that happens. This property is read-only.
