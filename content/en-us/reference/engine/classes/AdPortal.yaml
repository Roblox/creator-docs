name: AdPortal
type: class
memory_category: Instances
summary: |
  A portal that teleports players to a sponsored experience as part of immersive
  ads.
description: |
  An `AdPortal` is an instance that must be parented to a `Class.Part` —
  attempting to parent it elsewhere throws an error. When added to the data
  model, it registers itself with `Class.AdService` to be served portal ads on
  rotation, and it uses a child `Class.AdGui` to display the current ad's banner
  image and destination label above the portal.

  When the local player's character touches the parent part, the portal
  teleports that player to the sponsored experience associated with the
  currently served ad. The portal only teleports while it is valid and has been
  served an ad with a destination place (see `Class.AdPortal.Status`).
