  - name: AdService:RegisterAdOpportunityAsync
    summary: |
      Tracks how many times a user had the chance to watch a video ad and the
      rate at which they actually watched the ad.
    description: |
      This method may only be called from a `Class.Script` with
      `Enum.RunContext.Client`.

      Registers a `Class.GuiButton` for ad opportunity tracking. Once
      registered, the system periodically checks whether the button is visible
      and unobstructed (the topmost input-sinking element at its center point).
      These visibility transitions are reported as ad opportunity impressions
      and used to measure the rate at which users are presented with, and choose
      to watch, rewarded video ads.

      The `instance` must be a `Class.GuiButton` that is a descendant of a
      `Class.ScreenGui` under `Class.PlayerGui`. If the instance is moved out of
      a valid hierarchy at runtime, tracking pauses automatically and resumes
      when it returns to a valid ancestor. Call
      `Class.AdService:UnregisterAdOpportunity()|UnregisterAdOpportunity` to
      stop tracking the instance.
