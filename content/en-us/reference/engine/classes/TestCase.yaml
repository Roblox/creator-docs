name: TestCase
type: class
memory_category: Instances
summary: |
  A registered test, used inside its callback to check values.
description: |
  A `TestCase` is a test registered with `Class.TestService:RegisterTest()` or
  `Class.TestSuite:RegisterTest()`. It's passed as the first argument to the
  test's callback, where you call `Class.TestCase:Check()|Check()` and
  `Class.TestCase:Require()|Require()` to compare the values your code produces
  with the values you expect.

  `Class.TestService:ListTests()` also returns `TestCase` objects, which you can
  use to see each test's name, ID, tags, and timeout. A `TestCase` isn't an
  `Class.Instance` and can't be parented.

  ```lua
  local TestService = game:GetService("TestService")

  TestService:RegisterTest("health starts full", function(test)
  	local humanoid = Instance.new("Humanoid")
  	test:Check(humanoid.Health, humanoid.MaxHealth)
  	test:Check({ humanoid.Health, humanoid.MaxHealth }, { 100, 100 }, "default health")
  end)
  ```
