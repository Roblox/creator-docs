summary: |
  A `Class.Camera` that replicates and is saved as authored content, for use
  with `Class.ViewportFrame|ViewportFrames` or as a ThumbnailCamera.
description: |
  `ViewportCamera` is a `Class.Camera` intended for cameras that you set up at
  design time, such as a camera assigned to `Class.ViewportFrame.CurrentCamera`
  or a `ThumbnailCamera` inside a `Class.Model`. It has the same properties,
  methods, and events as `Class.Camera`, but unlike `Class.Camera` it
  replicates, so it works as expected in Team Create and when replicated from
  the server to clients.

  Use a `Class.Camera` for the camera that renders the 3D world, accessible
  through `Class.Workspace.CurrentCamera`. Use a `ViewportCamera` for any other
  camera that you author and want saved with the place.

  #### Autoupgrade behavior

  When you paste copied content containing a `Class.Camera` in Studio, any
  Cameras are automatically converted into `ViewportCamera`s with the same
  properties. This is to facilitate the common workflow of setting up a camera
  by positioning the main workspace camera, and then copy-pasting that camera.
