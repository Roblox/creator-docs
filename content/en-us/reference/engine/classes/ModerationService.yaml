      - name: priority
        type: int
        default:
        summary: |
          Determines the order in which this processor is invoked relative to
          other bound processors.
      - name: callback
        type: Function
        default:
        summary: |
          The function invoked for each reviewable-content event. It receives a
          table describing the event and should return `true` to acknowledge the
          event or `false` to leave it for redelivery.
    returns:
