description: |
  This class is an optional parameter to the
  `Class.TeleportService:TeleportAsync()` function that allows developers to
  provide arguments for the teleport call.

  Only one of the following private server routing fields may be set at a time.
  Setting more than one causes an error:

  - `Class.TeleportOptions.ReservedServerId`
  - `Class.TeleportOptions.VipServerId`
  - `Class.TeleportOptions.ReservedServerAccessCode`
  - `Class.TeleportOptions.ShouldReserveServer`
  - `Class.TeleportOptions.ServerInstanceId`

  For more information on how to teleport players between servers, see
  [Teleporting Between Places](../../../projects/teleport.md).
