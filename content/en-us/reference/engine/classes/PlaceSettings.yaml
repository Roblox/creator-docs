description: |
  `Class.PlaceSettings` reads and sets temporary rollout settings by name.
  Roblox uses these settings to introduce engine behavior changes in stages,
  typically with enum values such as `Default`, `Disabled`, and `Enabled`. Each
  setting belongs to a property on another service, such as `Class.Workspace`,
  but it isn't a permanent part of the API.

  Call `Class.PlaceSettings:GetActiveRollouts()` to list the available settings,
  then use `Class.PlaceSettings:GetRolloutState()` and
  `Class.PlaceSettings:SetRolloutState()` to read or change one. Settings are
  removed once their rollout finishes, so don't assume a name remains available
  over time.

  This service can only be used from plugins and Open Cloud.
