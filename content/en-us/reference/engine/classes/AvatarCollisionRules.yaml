    description: |
      The size, in studs, of the `CollisionPart` box used when
      `Class.AvatarCollisionRules.CollisionMode|CollisionMode` is
      `Enum.AvatarSettingsCollisionMode.SingleCollider`. Defaults to
      `(2, 3, 1)`. The size doesn't change with the character's body scale.

      The collider's top is level with the top of the body. A collider taller
      than the body reaches down to the floor instead.
