properties:
  - name: AvatarCollisionRules.CollisionMode
    summary: |
      Whether the character collides through its body parts, through inner
      boxes, or through a single box collider.
    description: |
      Determines the character's collision geometry:

      - `Enum.AvatarSettingsCollisionMode.Default`, the default: each body part
        collides with its own geometry.
      - `Enum.AvatarSettingsCollisionMode.Legacy`: each body part's collision
        geometry is replaced with a box inside the part.
      - `Enum.AvatarSettingsCollisionMode.SingleCollider`: one invisible box,
        sized by
        `Class.AvatarCollisionRules.SingleColliderSize|SingleColliderSize`,
        collides for the whole character.

      With `Enum.AvatarSettingsCollisionMode.SingleCollider`, the engine adds an
      invisible `Class.Part` named `CollisionPart` to the character, welded to
      the `HumanoidRootPart`, and the character's other parts, including
      accessories and equipped `Class.Tool|Tools`, stop colliding. Which parts
      detect touches and spatial queries is set by
      `Class.AvatarCollisionRules.TouchAndQueryDetectionMode|TouchAndQueryDetectionMode`.
