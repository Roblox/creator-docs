name: UIGradient
type: class
memory_category: Instances
summary: |
  Applies a color and transparency gradient to the parent `Class.GuiObject`.
description: |
  `UIGradient` applies a color and transparency gradient to the parent
  `Class.GuiObject`. The appearance of the gradient is configurable through its
  `Class.UIGradient.Color|Color`, `Class.UIGradient.Transparency|Transparency`,
  `Class.UIGradient.Offset|Offset`, `Class.UIGradient.Rotation|Rotation`,
  `Class.UIGradient.Scale|Scale`, `Class.UIGradient.TileMode|TileMode`, and
  `Class.UIGradient.Type|Type`.

  `UIGradient` will not apply to child or descendant
  `Class.GuiObject|GuiObjects`. In order to apply the same gradient to multiple
  objects, you will need multiple gradient instances.

  See also [appearance modifiers](../../../ui/appearance-modifiers.md#gradient)
  for more information on the `UIGradient` modifier and how it works.

  #### Supported Objects

  You can apply `UIGradient` modifiers to `Class.Frame`, `Class.TextLabel`,
  `Class.TextButton`, `Class.ImageLabel`, `Class.ImageButton`, `Class.Path2D`,
  and `Class.ViewportFrame`. However, `Class.ScrollingFrame` and `Class.TextBox`
  are not currently supported.

  #### Performance Considerations

  In order to efficiently use a `UIGradient`, follow these principles:

  - Avoid using more than 6 color stops on the `Class.UIGradient.Color|Color`
    sequence.

  - Avoid using a `UIGradient` on any object that applies a text stroke
    (`Class.TextLabel.TextStrokeColor3|TextStrokeColor3`), as the gradient will
    try to blend with strokes and borders, and may cause performance issues.

  - Avoid setting `Class.UIGradient.Color|Color` and
    `Class.UIGradient.Transparency|Transparency` frequently: this causes the
    sequence of colors to rebuild often, which is expensive. If possible, set
    these properties only once and try to animate the
    `Class.UIGradient.Offset|Offset` or `Class.UIGradient.Rotation|Rotation`
    properties to achieve a similar effect. Alternatively, you can change the
    color of the parent `Class.GuiObject` using such properties as
    `Class.GuiObject.BackgroundColor3|BackgroundColor3`,
    `Class.ImageLabel.ImageColor3|ImageColor3`, or
    `Class.TextLabel.TextColor3|TextColor3`.

  - When applying an unchanging gradient on a UI element whose state changes a
    lot, there is a tradeoff between using a `UIGradient` (processing time) and
    a static gradient image (memory).
