methods:
  - name: DigitsRigDescription:GetFingerControl
    summary: |
      Returns the current forward-kinematics control vector for the specified
      finger.
    description: |
      Returns the current control `Vector3` for the finger at the given 1-based
      index (1 = Thumb … 5 = Pinky). The components are:

      - **X** — extension in `[0, 1]`: `0` is fully curled, `1` is fully
        extended.
      - **Y** — lateral (side) rotation in `[-1, 1]`.
      - **Z** — axial (twist) rotation in `[-1, 1]`.
    code_samples: []
    parameters:
      - name: fingerIndex
        type: int
        default:
        summary: |
          1-based index of the finger to query (1 = Thumb, 2 = Index, 3 =
          Middle, 4 = Ring, 5 = Pinky).
    returns:
      - type: Vector3
        summary: |
          The control `Datatype.Vector3` whose X is extension [0, 1], Y is
          lateral rotation [-1, 1], and Z is axial rotation [-1, 1].
    tags: []
    deprecation_message: ''
    security: None
    thread_safety: Unsafe
    capabilities:
      - Animation
  - name: DigitsRigDescription:GetFingerTip
    summary: |
      Returns the world-space position of the fingertip for the specified
      finger.
    description: |
      Returns the world-space position of the fingertip for the finger at the
      given 1-based index (1 = Thumb … 5 = Pinky). Currently always returns
      `Vector3.zero`.
    code_samples: []
    parameters:
      - name: fingerIndex
        type: int
        default:
        summary: |
          1-based index of the finger to query (1 = Thumb, 2 = Index, 3 =
          Middle, 4 = Ring, 5 = Pinky).
    returns:
      - type: Vector3
        summary: |
          The world-space `Datatype.Vector3` position of the fingertip.
