  - name: DigitsRigDescription:SetFingerControl
    summary: |
      Drives the three-joint chain of the specified finger using forward
      kinematics.
    description: |
      Drives the three-joint chain of the finger at the given 1-based index (1 =
      Thumb … 5 = Pinky) using forward kinematics. The `control` components are
      clamped before application:

      - **X** — extension, clamped to `[0, 1]`.
      - **Y** — lateral rotation, clamped to `[-1, 1]` (maps to ±50°).
      - **Z** — axial rotation, clamped to `[-1, 1]` (maps to ±50°).

      Joint angles for the three phalanges are computed via Ptolemy's theorem
      applied to the chain lengths.
    code_samples: []
    parameters:
      - name: fingerIndex
        type: int
        default:
        summary: |
          1-based index of the finger to drive (1 = Thumb, 2 = Index, 3 =
          Middle, 4 = Ring, 5 = Pinky).
      - name: control
        type: Vector3
        default:
        summary: |
          A `Datatype.Vector3` whose X sets extension [0, 1], Y sets lateral
          rotation [-1, 1], and Z sets axial rotation [-1, 1]; each component is
          clamped before application.
    returns:
      - type: ()
        summary: |
          void
